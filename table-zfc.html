LWWPP"],["23102","LLLWPWPWWWWWLW"],["23103","LLLWLPPLWPLLWP"],["23104","WPPPPPLPWPLPWW"],["23105","PWLWLLWPPWPWLL"],["23106","WLPPWLWPPLLWPL"],["23107","WWPWWLPLLPWPWP"],["23108","WWPPPWWPPWPPPL"],["23109","LWLPWPLPWWWWWW"],["23110","LWLPLWWLLWLLWP"],["23111","PLWPPLPPWLPPPW"],["23112","LPPWWPPWPPLLWP"],["23113","WPWLLLPPPPWPPP"],["23114","PPLWWWWWPWPWPW"],["23115","PWPLPWLWPLWWPL"],["23116","LPPPLWPLPLPWLW"],["23117","LLWLLPLWPPWPPL"],["23118","LPLPWWWPWWPLPL"],["23119","LWLPWLLWLWWWLP"],["23120","WPLWWPLPPPLWPL"],["23121","WPWWWLLWPPWWWP"],["23122","WLPPWLLPPLPLWW"],["23123","LWLWLWPPPLWLPP"],["23124","WLLWWWLLPPLWLP"],["23125","LWPPPPPLPPPLWW"],["23126","PLPWPWWWPWWPPP"],["23127","PWWLLWLPWLWPPP"],["23128","LWLLWLPPPPWLPP"],["23129","WPPPWPWPPWWWWL"],["23130","PLLLLPPWPLPPPP"],["23131","PLPLWWWLLPPPPP"],["23132","WPWWWWPLWLPPWL"],["23133","PPLWPWWWWWPLPW"],["23134","PWWWLLWLWWWPWW"],["23135","LWLWWPLPPLLWLL"],["23136","PPPLWPPPPWPPPW"],["23137","WLWWPWWPWWLWPL"],["23138","PLLPPLPPWWWPPP"],["23139","WPLPPPPWPWWPPW"],["23140","WPPLWLWLPPWLWW"],["23141","WLPPPLLWPPLPPW"],["23142","LWWLWLWLLWWLPL"],["23143","PWPWWPPPLWPLWP"],["23144","LPPWWPPWWWPWWW"],["23145","PLWLPWWPPPWPWL"],["23146","WWPWPWPPPPLPPL"],["23147","WLWPLLWPPWWPPP"],["23148","LLPLWPWWWPLWWP"],["23149","PLPWWPPLPPPPLW"],["23150","LPLPWPPPWLWWWP"],["23151","PPWLLLPPWPPPWW"],["23152","PLLPWWPWPLWWPP"],["23153","PLWPWWPWWLPWLP"],["23154","PWLLPPPPLLWPLP"],["23155","WLPWLWLLPWPLWP"],["23156","PWPPPPWWPWWWPP"],["23157","WPLPPLWWPPPWPW"],["23158","LPWLLWWLWPLLWL"],["23159","PLPLWLWPPPLPPP"]];
const OUT=[{k:'W',t:'胜',c:'w'},{k:'P',t:'平',c:'d'},{k:'L',t:'负',c:'l'}];  // 顺序：胜/平/负
const KI={W:0,P:1,L:2};
const $=s=>document.querySelector(s);
let added=JSON.parse(localStorage.getItem('zfc-twin')||'[]');
let liveRows=[];
let show={om:true,mx:true};
let recTier=0;  // 复式：加倍场数（默认单关，最保守）
const THEME_KEY='twin-theme';
function applyTheme(){
  const th=localStorage.getItem(THEME_KEY)==='light'?'light':'dark';
  document.documentElement.dataset.theme=th;
  const b=$('#themeBtn'); if(b) b.textContent=th==='light'?'暗色':'亮色';
  const meta=document.querySelector('meta[name="theme-color"]'); if(meta) meta.setAttribute('content',th==='light'?'#eef1f6':'#0f1115');
}
function heatBg(a){ const light=document.documentElement.dataset.theme==='light'; return `background:rgba(${light?'103,65,217':'124,92,255'},${(light?a*.45:a).toFixed(2)})`; }

// 录入归一化：胜/W/3→W，平/P/1→P，负/L/0→L
function normDig(raw){
  const map={'胜':'W','w':'W','W':'W','3':'W','平':'P','p':'P','P':'P','1':'P','负':'L','l':'L','L':'L','0':'L'};
  return [...raw].map(c=>map[c]).filter(Boolean);
}
function mergedRows(){
  const map=new Map();
  ROWS.concat(liveRows,added).forEach(([iss,d])=>{
    const id=String(iss||'').trim(), dig=normDig(String(d||'')).join('');
    if(id&&dig.length===14) map.set(id,[id,dig]);
  });
  return [...map.values()].sort((a,b)=>(+a[0])-(+b[0]));
}

function compute(){
  const seq=mergedRows().map(([iss,d],i,arr)=>({iss, r:[...d], prevIss:i>0?arr[i-1][0]:null}));
  const om=Array.from({length:14},()=>[0,0,0]);   // 当前遗漏：[W,P,L] 出现清零，否则+1
  let prev=null;
  seq.forEach((row,i)=>{
    const r=row.r;
    for(let m=0;m<14;m++) for(let o=0;o<3;o++) om[m][o]= r[m]===OUT[o].k ? 0 : om[m][o]+1;
    row.om=om.map(a=>a.slice());
    // 该场最大遗漏 + 是哪个结果最该出
    row.mx=om.map(a=>{ const mv=Math.max(...a); return {v:mv, o:a.indexOf(mv)}; });
    row.cnt={W:r.filter(x=>x==='W').length, P:r.filter(x=>x==='P').length, L:r.filter(x=>x==='L').length};
    row.dup=prev? r.reduce((s,x,k)=>s+(x===prev[k]?1:0),0):0;
    row.season=i>0 && String(row.iss).slice(0,2)!==String(seq[i-1].iss).slice(0,2);
    prev=r;
  });
  return seq;
}

// 推荐：每场按全史频率取众数；复式在“最不确定”的场上加次选
function recommend(seq){
  const N=seq.length;
  const freq=Array.from({length:14},()=>[0,0,0]); // [W,P,L] 计数
  seq.forEach(row=>row.r.forEach((x,m)=>freq[m][KI[x]]++));
  const last=seq[N-1];
  const perMatch=freq.map((f,m)=>{
    const ord=[0,1,2].slice().sort((a,b)=>f[b]-f[a]);
    const gap=(f[ord[0]]-f[ord[1]])/N;             // 越小越不确定
    return {m, f, ord, top:ord[0], second:ord[1], gap, om:last.om[m]};
  });
  // 加倍优先级：gap 最小（最不确定）的场
  const byUncertain=perMatch.slice().sort((a,b)=>a.gap-b.gap).map(x=>x.m);
  return {freq, perMatch, byUncertain, N};
}

function renderRec(seq){
  const R=recommend(seq);
  const dblSet=new Set(R.byUncertain.slice(0,recTier));
  const bets=Math.pow(2,recTier);
  // 单关串
  const strs=R.perMatch.map(pm=>{
    const o1=OUT[pm.top], dbl=dblSet.has(pm.m);
    const picks=dbl?[OUT[pm.top].t,OUT[pm.second].t].join('/'):o1.t;
    return `<div class="rb ${o1.c} ${dbl?'dbl':''}"><small>${pm.m+1}</small>${picks}</div>`;
  }).join('');
  const tiers=[[0,'单关',1],[5,'稳健 +5双',32],[9,'激进 +9双',512]];
  const tierCards=tiers.map(([n,lab,b])=>`<button class="tier ${recTier===n?'on':''}" data-tier="${n}"><div class="t">${lab}</div><div class="v num">${b.toLocaleString()} 注 · ¥${(b*2).toLocaleString()}</div><div class="s">${n?('加倍 '+n+' 场'):'14 场各 1 选'}</div></button>`).join('');
  // 全史胜平负基准率
  const tot=R.freq.reduce((a,f)=>[a[0]+f[0],a[1]+f[1],a[2]+f[2]],[0,0,0]); const T=tot[0]+tot[1]+tot[2];
  $('#rec').innerHTML=`<div class="rec">
    <div class="rec-tag">本期单关推荐 · 频率众数（第 ${seq.length} 期后）</div>
    <div class="rec-str">${strs}</div>
    <div class="rec-kpis">
      <span>复式注数 <b class="num">${bets.toLocaleString()}</b></span>
      <span>金额 <b class="num">¥${(bets*2).toLocaleString()}</b></span>
      <span>全史基准 <b class="num">胜${(tot[0]/T*100).toFixed(0)}% 平${(tot[1]/T*100).toFixed(0)}% 负${(tot[2]/T*100).toFixed(0)}%</b></span>
    </div>
    <div class="tiers">${tierCards}</div>
    <div class="rec-note">推荐 = 每场历史出现最多的结果；复式在最“胜平负接近”的场加次选。注意：胜负彩各场基本独立，历史频率只是<b>基准率</b>，真正信号是<b>赔率 / 盘口</b>，本表用于走势复盘与复式注数估算。奖池负期望，理性购彩。</div>
  </div>`;
}

function render(){
  const seq=compute();
  const N=seq.length;
  let h1='<tr><th class="col-iss" rowspan="2">期号</th>';
  for(let m=1;m<=14;m++) h1+=`<th class="grp" rowspan="2">${m}</th>`;
  h1+='<th class="grp" rowspan="2">胜平负</th><th rowspan="2">重</th>';
  if(show.om) for(let m=1;m<=14;m++) h1+=`<th class="grp" colspan="3">${m}</th>`;
  if(show.mx) h1+=`<th class="grp" colspan="14">每场最大遗漏</th>`;
  h1+='</tr><tr class="r2">';
  if(show.om) for(let m=0;m<14;m++) OUT.forEach(o=>h1+=`<th>${o.t}</th>`);
  if(show.mx) for(let m=1;m<=14;m++) h1+=`<th>${m}</th>`;
  h1+='</tr>';
  let body='';
  for(let i=N-1;i>=0;i--){
    const r=seq[i]; const latest=i===N-1?' latest':''; const season=r.season?' season':'';
    let tr=`<tr class="${latest}${season}"><td class="col-iss">${r.iss}</td>`;
    r.r.forEach((x,m)=>{ const o=OUT[KI[x]]; tr+=`<td class="r ${o.c} grp">${o.t}</td>`; });
    tr+=`<td class="cnt grp"><span class="cw">${r.cnt.W}</span> <span class="cd">${r.cnt.P}</span> <span class="cl">${r.cnt.L}</span></td><td class="dup">${r.dup}</td>`;
    if(show.om) for(let m=0;m<14;m++){ const mxp=r.mx[m].v; for(let o=0;o<3;o++){ const v=r.om[m][o];
      const cls=v===0?'zero':(v===mxp&&v>0?'max':''); const bg=v>0&&cls!=='max'?heatBg(Math.min(v/22,0.5)):'';
      tr+=`<td class="om ${cls} ${o===0?'grp':''}" style="${bg}">${v}</td>`; } }
    if(show.mx) r.mx.forEach((mm,m)=>{ const oc=['ow','od','ol'][mm.o]; tr+=`<td class="mx ${m===0?'grp':''}">${mm.v}<b class="${oc}">${OUT[mm.o].t}</b></td>`; });
    tr+='</tr>'; body+=tr;
  }
  $('#tbl').innerHTML='<thead>'+h1+'</thead><tbody>'+body+'</tbody>';
  const last=seq[N-1];
  $('#stat').innerHTML=`共 <b>${N}</b> 期（内置 ${ROWS.length} 期 + 实时 ${liveRows.length} 期 + 手动 ${added.length} 期）　最新 <b>${last.iss}</b> = ${last.r.map(x=>OUT[KI[x]].t).join('')}　胜平负 <b>${last.cnt.W}/${last.cnt.P}/${last.cnt.L}</b>`;
  $('#legend').innerHTML=`口径同原表：每场 <span class="k" style="background:rgba(229,72,77,.12);color:#ff8a8d">胜</span><span class="k" style="background:rgba(227,179,65,.12);color:#ffd877">平</span><span class="k" style="background:rgba(91,155,255,.12);color:#a3c4ff">负</span>。遗漏矩阵 = 每场各结果已连续多少期未出（<span class="k" style="background:rgba(22,163,74,.16);color:#7ee2a8">绿=本期开出</span>，<span class="k" style="box-shadow:inset 0 0 0 1.5px var(--win);color:#ff8a8d">红框=该场当前最久未出</span>）。胜平负 = 当期 14 场里 胜 / 平 / 负 各几场；重 = 与上期相同场数；紫线 = 跨赛季分隔。`;
  renderRec(seq);
}

$('#tAdd').onclick=()=>{
  const iss=$('#tIssue').value.trim(); const d=normDig($('#tDig').value);
  if(!iss){ toast('请填期号'); return; }
  if(d.length!==14){ toast('开奖需 14 场（胜平负 / 3 1 0），现 '+d.length+' 场'); return; }
  added.push([iss,d.join('')]); localStorage.setItem('zfc-twin',JSON.stringify(added));
  $('#tIssue').value=''; $('#tDig').value=''; render(); toast('已录入 '+iss);
  $('.wrap').scrollTop=0;
};
$('#tUndo').onclick=()=>{ if(!added.length){ toast('无录入可撤销'); return; } const x=added.pop(); localStorage.setItem('zfc-twin',JSON.stringify(added)); render(); toast('已撤销 '+x[0]); };
document.querySelectorAll('.tog button').forEach(b=>b.onclick=()=>{ const g=b.dataset.grp; show[g]=!show[g]; b.classList.toggle('on',show[g]); render(); });
document.addEventListener('click',e=>{ const t=e.target.closest('[data-tier]'); if(t){ recTier=+t.dataset.tier; render(); } });
$('#themeBtn').onclick=()=>{ const next=document.documentElement.dataset.theme==='light'?'dark':'light'; localStorage.setItem(THEME_KEY,next); applyTheme(); render(); };
let tt; function toast(m){ const e=$('#toast'); e.textContent=m; e.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>e.classList.remove('on'),1600); }
async function loadOfficial(){
  try{
    const ctl=new AbortController(), timer=setTimeout(()=>ctl.abort(),8000);
    let r; try{ r=await fetch('api/zfc',{signal:ctl.signal,cache:'no-store'}); } finally{ clearTimeout(timer); }
    if(!r.ok) return; const j=await r.json(); if(!j||!j.ok||!Array.isArray(j.recent)) return;
    const newest=+ROWS[ROWS.length-1][0]||0;
    liveRows=j.recent.map(x=>[String(x[0]||''),normDig(String(x[1]||'')).join('')])
      .filter(([iss,d])=>(+iss||0)>newest&&d.length===14).sort((a,b)=>(+a[0])-(+b[0]));
    render();
  }catch(e){}
}
applyTheme(); render(); loadOfficial();
</script>
</body>
</html>
